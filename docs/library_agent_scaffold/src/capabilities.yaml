# Intrinsic model capabilities for s-transformers-lib (Component 1 / P1).
# EXTRACTED from the transformer-ts-ranking capability matrix, which was
# validated empirically by the benchmark. On adoption in the library, these
# should be DECLARED in each model's config.py (design doc §4); this bundled
# YAML is the portable interim source. Verify `is_pretrained_zeroshot` and
# `family` per model when distributing.
airformer:
  family: encoder_only
  is_pretrained_zeroshot: false
  requires_exogenous: false
  requires_irregular_times: false
  requires_spatial_structure: false
  requires_time_marks: false
  supports_regular_mts: true
  supports_univariate: true
