# Human-authored documentation bits for model cards (Component 3 / P3).
# The DECLARED capabilities and the config schema are derived automatically;
# only these prose fields are hand-written. Optional per model — a card renders
# without an entry here. Two examples are filled as a template; complete the rest.
#
# The empirical `runtime:` block is NOT here — it is fed separately by the
# benchmark's runtime_evidence.json (design doc §12).

patchtst:
  summary: "Patch-based channel-independent transformer; strong general long-term baseline."
  paper: "A Time Series is Worth 64 Words (Nie et al., 2023)"
  selection_hints:
    good_for: ["long-horizon multivariate", "channel-independent series"]
    avoid_when: ["irregular sampling", "very short series"]

itransformer:
  summary: "Inverts the attention to operate over variates; strong on multivariate benchmarks."
  paper: "iTransformer: Inverted Transformers Are Effective for Time Series Forecasting (Liu et al., 2024)"
  selection_hints:
    good_for: ["multivariate with many channels"]
    avoid_when: ["irregular sampling"]
