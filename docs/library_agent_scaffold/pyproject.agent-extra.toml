# Snippet to MERGE into the library's pyproject.toml.
# The core (capabilities, schemas, model cards, selection) adds NO heavy deps
# beyond PyYAML. Only the MCP transport is optional.

[project.optional-dependencies]
agent = [
    "mcp",   # Model Context Protocol server (Component 4 / P5)
]

# Entry point so `python -m s_transformers_lib.agent.mcp_server` works after
# `pip install s-transformers-lib[agent]`.
[project.scripts]
s-transformers-mcp = "s_transformers_lib.agent.mcp_server:main"
