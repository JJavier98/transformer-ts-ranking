# Snippet to MERGE into the library's pyproject.toml (do not copy wholesale).
# Adds a `docs` optional extra plus the tooling gates from the design doc §5.1/§8.

[project.optional-dependencies]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-jupyter",
    "mike",                 # versioned docs
]

# Docstring lint (D8): enable pydocstyle (`D`) rules with the NumPy convention.
[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# Docstring coverage gate (D8): start at the current level, then ratchet up.
[tool.interrogate]
fail-under = 90
ignore-init-method = true
ignore-magic = true
ignore-private = true
exclude = ["tests", "examples", "docs"]
