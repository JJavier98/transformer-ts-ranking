# Optional CI: build the docs on every PR (build gate, design doc §8 D7) and
# deploy versioned docs to GitHub Pages on release. Use this INSTEAD of Read the
# Docs if you prefer GH Pages. Place at .github/workflows/docs.yml in the library.

name: docs

on:
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "src/**", "scripts/gen_*.py"]
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # mike needs history
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ".[docs]"
      - name: Build (strict — fail on warnings/broken refs)
        run: mkdocs build --strict

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ".[docs]"
      - run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          mike deploy --push --update-aliases "${GITHUB_REF_NAME}" latest
