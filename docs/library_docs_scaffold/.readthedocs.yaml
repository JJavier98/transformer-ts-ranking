# Read the Docs build (design doc §5.6/§12). Place at the library repo root.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

mkdocs:
  configuration: mkdocs.yml

# Install the library itself (needed so mkdocstrings can import it for autodoc
# and gen_model_pages can call list_models()) plus the docs extra.
python:
  install:
    - method: pip
      path: "."
      extra_requirements:
        - docs
