[project]
name = "transformer-ts-ranking"
version = "0.1.0"
description = "Reproducible benchmark pipeline for ranking transformer models on time-series forecasting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JJavier98" }]

dependencies = [
    # Core numeric & data
    "numpy>=2.0",
    "pandas>=2.0",
    "pyarrow>=20.0",
    # Stats & visualisation
    "scipy>=1.10",
    "scikit-posthocs>=0.9",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
    # Deep learning. Pinned to a CUDA build that still ships Volta (sm_70)
    # kernels + a cuDNN that supports SM 7.0, so the V100 (dgx) and A100 (dgx2)
    # nodes both work. See [tool.uv.sources] below for the index pin.
    "torch>=2.5,<2.7",
    # Config management
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    # Experiment tracking
    "wandb>=0.15",
    # Serialisation / misc
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # The benchmarked library (git submodule). Installed editable via
    # [tool.uv.sources] so its runtime deps (einops, reformer-pytorch,
    # local-attention, pytorch-lightning, torchmetrics, ...) land in the env.
    "s-transformers-lib",
    "chronos-forecasting>=2.2.2",
    "gluonts[torch]>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[project.scripts]
transformer-ts-ranking = "transformer_ts_ranking.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transformer_ts_ranking"]

# ---------------------------------------------------------------------------
# UV
# ---------------------------------------------------------------------------
[tool.uv]
# Commit uv.lock for reproducible benchmark environments.
# IMPORTANT: the cluster GPUs are a mix of V100 (dgx, compute_cap 7.0, driver
# 535.x) and A100 (dgx2, compute_cap 8.0). The cu128 wheels ship cuDNN 9.19,
# which DROPPED Volta (SM < 7.5) support — they crash on the V100 nodes with
# "no kernel image available" / "cuDNN not compatible with SM < 7.5". cu124
# (cuDNN 9.1) still supports Volta and runs on driver 535 via CUDA minor-version
# compatibility, so it covers both GPU generations.

[tool.uv.sources]
# Pin torch to the PyTorch cu124 index so V100 (sm_70) kernels are present.
torch = [{ index = "pytorch-cu124" }]
# Point uv to the local submodule so it can be editable-installed together
# with the main project.
s-transformers-lib = { path = "s-transformers-lib", editable = true }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
# Only used for packages explicitly pinned to it (torch). Everything else
# resolves from PyPI — otherwise uv would try to pull e.g. torchmetrics from
# this index, which only carries an outdated 1.0.3.
explicit = true

# ---------------------------------------------------------------------------
# Ruff (linter / formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["transformer_ts_ranking"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "s-transformers-lib"]
