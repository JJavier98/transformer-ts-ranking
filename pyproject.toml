[project]
name = "transformer-ts-ranking"
version = "0.1.0"
description = "Reproducible benchmark pipeline for ranking transformer models on time-series forecasting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JJavier98" }]

dependencies = [
    # Core numeric & data
    "numpy>=2.0",
    "pandas>=2.0",
    "pyarrow>=20.0",
    # Stats & visualisation
    "scipy>=1.10",
    "scikit-posthocs>=0.9",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
    # Deep learning (CPU wheel; GPU variant installed separately via torch_env)
    "torch>=2.5",
    # Config management
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    # Experiment tracking
    "wandb>=0.15",
    # Serialisation / misc
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[project.scripts]
transformer-ts-ranking = "transformer_ts_ranking.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transformer_ts_ranking"]

# ---------------------------------------------------------------------------
# UV
# ---------------------------------------------------------------------------
[tool.uv]
# Commit uv.lock for reproducible benchmark environments.
# The CUDA-specific torch wheels are installed via the extra index below.
extra-index-url = ["https://download.pytorch.org/whl/cu124"]
# Development dependencies live in the optional [dev] group so production
# installs stay lean.

[tool.uv.sources]
# Point uv to the local submodule so it can be editable-installed together
# with the main project.
s-transformers-lib = { path = "s-transformers-lib", editable = true }

# ---------------------------------------------------------------------------
# Ruff (linter / formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["transformer_ts_ranking"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "s-transformers-lib"]
