  autoformer: Autoformer
  basisformer: BasisFormer
  card: CARD
  cats: CATS
  chronos_bolt: Chronos-Bolt
  contiformer: ContiFormer
  contiformer_fast: ContiFormer-fast$^\dagger$
  crossformer: Crossformer
  deformable_tst: DeformableTST
  earthformer: Earthformer
  etsformer: ETSformer
  fedformer: FEDformer
  informer: Informer
  itransformer: iTransformer
  lag_llama_pretrained: Lag-Llama
  multipatchformer: MultiPatchFormer
  nonstationary_transformer: NS-Transformer
  patchtst: PatchTST
  pathformer: Pathformer
  pyraformer: Pyraformer
  quatformer: Quatformer
